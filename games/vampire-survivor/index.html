<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vampire Survivor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="game-header">
            <h1>Vampire Survivor</h1>
            <div class="stats">
                <div class="stat">Level: <span id="level">1</span></div>
                <div class="stat">Kills: <span id="kills">0</span></div>
            </div>
        </div>
        <div id="start-screen" class="start-screen">
            <h2>Survive the Horde</h2>
            <p>WASD or Arrow Keys to move</p>
            <p>Auto-attacks target nearest enemy</p>
            <button id="start-btn" class="start-btn">Start Game</button>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="upgrade-screen" class="upgrade-screen hidden">
            <h2>Level Up!</h2>
            <div id="upgrade-options" class="upgrade-options"></div>
        </div>
        <div id="game-over-screen" class="game-over-screen hidden">
            <h2>Game Over</h2>
            <div class="game-over-stats">
                <p>Level Reached: <span id="final-level">0</span></p>
                <p>Total Kills: <span id="final-kills">0</span></p>
            </div>
            <button id="play-again-btn" class="start-btn">Play Again</button>
        </div>
        <div class="game-controls">
            <button id="back-btn" class="control-btn back-btn">Back to Arcade</button>
            <button id="restart-btn" class="control-btn restart-btn">Restart</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
