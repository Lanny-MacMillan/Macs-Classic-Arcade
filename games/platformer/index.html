<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platformer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="game-header">
            <h1>Platformer</h1>
            <div class="game-info">
                <div class="score">Level: <span id="level">1</span></div>
                <div class="score">Coins: <span id="coins">0</span>/<span id="total-coins">0</span></div>
            </div>
            <button id="main-back-btn" class="back-btn-header">Back to Arcade</button>
        </div>
        <div id="start-screen" class="start-screen">
            <h2>Ready to Jump?</h2>
            <p>Use Arrow Keys or WASD to move</p>
            <p>SPACE to jump</p>
            <button id="start-btn" class="start-btn">Start Game</button>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="game-over-screen" class="game-over-screen hidden">
            <h2 id="game-over-title">Game Over</h2>
            <p id="game-over-message"></p>
            <div class="game-over-buttons">
                <button id="play-again-btn" class="game-btn">Play Again</button>
                <button id="back-btn" class="game-btn secondary">Back to Arcade</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
