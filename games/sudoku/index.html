<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="game-header">
            <h1 class="game-title">Sudoku</h1>
            <div class="game-status">Select a cell and type 1-9</div>
        </div>
        <div class="sudoku-board"></div>
        <div class="game-controls">
            <button id="back-btn" class="back-btn">Back to Arcade</button>
            <button class="reset-btn">Reset Game</button>
            <button class="new-puzzle-btn">New Puzzle</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
