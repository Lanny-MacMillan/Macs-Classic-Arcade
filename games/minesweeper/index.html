<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="game-header">
            <h1>Minesweeper</h1>
            
            <div class="difficulty-selector">
                <button id="easy-btn" class="difficulty-btn active">Easy</button>
                <button id="medium-btn" class="difficulty-btn">Medium</button>
                <button id="hard-btn" class="difficulty-btn">Hard</button>
            </div>
            
            <div class="game-info">
                <div class="info-item">
                    <span class="label">Mines:</span>
                    <span id="mine-count" class="value">10</span>
                </div>
                <div class="info-item">
                    <span class="label">Status:</span>
                    <span id="game-status" class="value">Playing</span>
                </div>
            </div>
        </div>
        
        <div class="game-container">
            <div id="board" class="board"></div>
            
            <div class="game-controls">
                <button id="back-btn" class="control-btn back-btn">Back to Arcade</button>
                <button id="reset-btn" class="control-btn reset-btn">Reset Game</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
