<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KenKen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="game-header">
            <div class="title-container">
                <h1>KenKen</h1>
                <button class="info-btn" id="info-btn" title="How to Play">?</button>
            </div>
            <div class="game-info">
                <button id="check-btn" class="check-btn">Check Solution</button>
                <button id="clear-btn" class="clear-btn">Clear Grid</button>
            </div>
        </div>
        <div class="instructions" id="instructions" style="display: none;">
            <button class="close-instructions" id="close-instructions">×</button>
            <p><strong>How to Play:</strong> Fill the grid so each row and column contains unique numbers from 1 to grid size. Each cage (outlined area) must produce the target number using the specified operation. Left-click a cell to enter a number.</p>
        </div>
        <div id="game-container" class="game-container">
            <div id="kenken-grid"></div>
        </div>
        <div id="message" class="message"></div>
        <div class="game-controls">
            <button id="back-btn" class="control-btn back-btn">Back to Arcade</button>
            <button id="new-puzzle-btn" class="control-btn">New Puzzle</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
