<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Fight</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="game-header">
            <h1>Boss Fight</h1>
            <div class="level-info">
                <div id="level-display" class="level-text">Level 1: Guardian Awakened</div>
                <div id="upgrade-display" class="upgrade-text">Standard Shot</div>
            </div>
            <div class="game-info">
                <div class="health-bar">
                    <span>Player HP:</span>
                    <div class="health-container">
                        <div id="player-health" class="health-fill"></div>
                    </div>
                </div>
                <div class="health-bar">
                    <span>Boss HP:</span>
                    <div class="health-container">
                        <div id="boss-health" class="health-fill boss"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="canvas-container">
            <div id="start-screen" class="start-screen">
                <h2>Face the Ancient Guardian</h2>
                <p>Use WASD or Arrow Keys to move</p>
                <p>Press SPACE to shoot</p>
                <p>Dodge attack patterns and defeat the boss</p>
                <button id="start-btn" class="start-btn">Begin Battle</button>
            </div>
            <canvas id="gameCanvas"></canvas>
            <div id="game-over-screen" class="game-over-screen hidden">
                <h2 id="game-over-title">Victory</h2>
                <p id="game-over-message"></p>
                <button id="next-level-btn" class="start-btn hidden">Next Level</button>
                <button id="play-again-btn" class="start-btn">Fight Again</button>
            </div>
        </div>
        <div class="game-controls">
            <button id="back-btn" class="control-btn back-btn">Back to Arcade</button>
            <button id="restart-btn" class="control-btn restart-btn">Restart</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
