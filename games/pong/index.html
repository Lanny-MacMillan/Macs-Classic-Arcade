<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="game-header">
            <h1>Pong</h1>
            <div class="game-info">
                <div class="score">Player: <span id="player-score">0</span></div>
                <div class="score">Opponent: <span id="opponent-score">0</span></div>
            </div>
        </div>
        <div id="start-screen" class="start-screen">
            <h2>Ready to Play?</h2>
            <p>Use W/S or Arrow keys to move your paddle</p>
            <div class="difficulty-selector">
                <p class="difficulty-label">Select Difficulty:</p>
                <div class="difficulty-buttons">
                    <button class="difficulty-btn active" data-difficulty="easy">Easy</button>
                    <button class="difficulty-btn" data-difficulty="medium">Medium</button>
                    <button class="difficulty-btn" data-difficulty="hard">Hard</button>
                </div>
            </div>
            <button id="start-btn" class="start-btn">Start Game</button>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="game-over-screen" class="game-over-screen hidden">
            <h2 id="game-over-title">Game Over</h2>
            <p id="game-over-message"></p>
            <button id="play-again-btn" class="start-btn">Play Again</button>
        </div>
        <div class="game-controls">
            <button id="back-btn" class="control-btn back-btn">Back to Arcade</button>
            <button id="restart-btn" class="control-btn restart-btn">Restart</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
