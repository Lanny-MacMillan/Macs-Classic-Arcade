<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="game-header">
            <h1>Stack</h1>
            <div class="game-info">
                <div class="score">Score: <span id="score">0</span></div>
                <div class="score">Best: <span id="best-score">0</span></div>
            </div>
        </div>
        <div id="start-screen" class="start-screen">
            <h2>Ready to Stack?</h2>
            <p>Click or press SPACE to drop the block</p>
            <p>Stack blocks as perfectly as you can!</p>
            <button id="start-btn" class="start-btn">Start Game</button>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="game-over-screen" class="game-over-screen hidden">
            <h2>Game Over</h2>
            <p>Final Score: <span id="final-score">0</span></p>
            <button id="play-again-btn" class="start-btn">Play Again</button>
        </div>
        <div class="game-controls">
            <button id="back-btn" class="control-btn back-btn">Back to Arcade</button>
            <button id="restart-btn" class="control-btn restart-btn">Restart</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
