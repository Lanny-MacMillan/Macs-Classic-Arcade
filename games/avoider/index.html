<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avoider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="game-header">
            <h1>Avoider</h1>
            <div class="game-info">
                <div class="score">Score: <span id="score">0</span></div>
                <div class="speed">Speed: <span id="speed">1x</span></div>
            </div>
        </div>
        <div id="start-screen" class="start-screen">
            <h2>Ready to Dodge?</h2>
            <p>Use Arrow Keys or A/D to move left and right</p>
            <p>Avoid the falling obstacles as long as you can!</p>
            <button id="start-btn" class="start-btn">Start Game</button>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="game-over-screen" class="game-over-screen hidden">
            <h2>Game Over!</h2>
            <p id="final-score"></p>
            <button id="play-again-btn" class="start-btn">Play Again</button>
        </div>
        <div class="game-controls">
            <button id="back-btn" class="control-btn back-btn">Back to Arcade</button>
            <button id="restart-btn" class="control-btn restart-btn">Restart</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
