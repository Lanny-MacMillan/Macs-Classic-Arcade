<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mac's Classic Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header class="arcade-header">
            <img src="./shared/images/MacsClassicArcade.png" alt="Mac's Classic Arcade" class="arcade-logo">
            <!-- <p class="subtitle">Choose Your Game</p> -->
        </header>

        <div class="view-controls">
            <button class="view-btn active" data-view="grid" title="Grid View">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                </svg>
            </button>
            <button class="view-btn" data-view="compact" title="Compact View">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="7"></rect>
                    <rect x="3" y="14" width="18" height="7"></rect>
                </svg>
            </button>
            <button class="view-btn" data-view="list" title="List View">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
            </button>
        </div>

        <main id="main-screen" class="game-grid">
        </main>

        <div id="game-container" class="game-container hidden">
            <iframe id="game-frame" frameborder="0"></iframe>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
